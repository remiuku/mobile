name: Android prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag
        run: python3 tools/validate_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo 'Release signing secrets are incomplete' >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ vars.SPICY_LYRICS_CLIENT_KEY }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          case "$SPICY_LYRICS_CLIENT_KEY" in
            sl_pk_*) ;;
            *) echo 'Set the publishable SPICY_LYRICS_CLIENT_KEY repository variable before releasing' >&2; exit 1 ;;
          esac
          if [ -z "$UMAMI_WEBSITE_ID" ]; then
            echo 'Set the UMAMI_WEBSITE_ID repository variable before releasing' >&2
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease testDebugUnitTest lintRelease
      - name: Verify and name APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          # Also under the name from before the rename: installs from then only update to that name.
          for name in spicy-lyrics-mobile spicy-player; do
            cp "$apk" "$name-${GITHUB_REF_NAME}.apk"
            sha256sum "$name-${GITHUB_REF_NAME}.apk" > "$name-${GITHUB_REF_NAME}.apk.sha256"
          done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "spicy-lyrics-mobile-${GITHUB_REF_NAME}.apk" \
            "spicy-lyrics-mobile-${GITHUB_REF_NAME}.apk.sha256" \
            "spicy-player-${GITHUB_REF_NAME}.apk" \
            "spicy-player-${GITHUB_REF_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spicy Lyrics Mobile $GITHUB_REF_NAME" \
            --generate-notes --prerelease --verify-tag
